<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .service {
        fill: #fff;
        stroke: #d86613;
        stroke-width: 3;
      }

      .gearman {
        fill: #fff;
        stroke: #404040;
        stroke-width: 3;
      }

      .label {
        fill: #111;
        font-family: sans-serif;
        font-size: 18px;
        text-anchor: middle;
      }

      .connection {
        fill: none;
        stroke: #111;
        stroke-width: 2;
      }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <rect class="service" x="30" y="45" width="150" height="70" rx="6"/>
  <text class="label" x="105" y="87">MCP server</text>

  <rect class="gearman" x="245" y="45" width="150" height="70" rx="6"/>
  <text class="label" x="320" y="87">Gearman</text>

  <rect class="service" x="460" y="35" width="150" height="70" rx="6"/>
  <rect class="service" x="468" y="43" width="150" height="70" rx="6"/>
  <rect class="service" x="476" y="51" width="150" height="70" rx="6"/>
  <text class="label" x="551" y="93">MCP client(s)</text>

  <line class="connection" x1="185" y1="70" x2="235" y2="70" marker-end="url(#arrowhead)"/>
  <line class="connection" x1="235" y1="95" x2="185" y2="95" marker-end="url(#arrowhead)"/>
  <line class="connection" x1="400" y1="70" x2="450" y2="70" marker-end="url(#arrowhead)"/>
  <line class="connection" x1="450" y1="95" x2="400" y2="95" marker-end="url(#arrowhead)"/>
</svg>
