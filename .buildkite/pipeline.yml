steps:
  - commands:
      - .buildkite/scripts/format_check.sh
      - .buildkite/scripts/run_linting.sh
    label: "format check and lint"

  - wait

  - label: ":python: s3_start_transfer tests"
    command: .buildkite/scripts/run_lambda_tests.sh s3_start_transfer

  - label: ":python: transfer_monitor tests"
    command: .buildkite/scripts/run_lambda_tests.sh transfer_monitor

  - wait

  # Each image step is serialised across builds, so a second build for the same immutable tag
  # sees it published and skips the push rather than failing on it.
  - label: ":docker: dashboard"
    command: archivematica-apps/archivematica/build_and_publish_image.sh dashboard
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-dashboard
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: MCP client"
    command: archivematica-apps/archivematica/build_and_publish_image.sh mcp-client
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-mcp-client
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: MCP server"
    command: archivematica-apps/archivematica/build_and_publish_image.sh mcp-server
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-mcp-server
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: Archivematica storage service"
    command: archivematica-apps/archivematica-storage-service/build_and_publish_image.sh
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-storage-service
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: nginx"
    commands:
      - "./.buildkite/scripts/build_docker_image.sh archivematica-nginx"
      - "./.buildkite/scripts/publish_docker_image.sh archivematica-nginx"
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-nginx
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: observability"
    commands:
      - "./.buildkite/scripts/build_docker_image.sh archivematica-observability"
      - "bash .buildkite/scripts/run_observability_tests.sh"
      - "./.buildkite/scripts/publish_docker_image.sh archivematica-observability"
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-archivematica-observability
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - label: ":docker: clamavd"
    commands:
      - "./.buildkite/scripts/build_docker_image.sh clamavd"
      - "./.buildkite/scripts/publish_docker_image.sh clamavd"
    concurrency: 1
    concurrency_group: archivematica-infrastructure/image-clamavd
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::299497370133:role/workflow-ci"

  - wait

  - label: ":shield: Upload SBOMs to Dependency-Track"
    command: bash .buildkite/scripts/upload_sboms.sh
    if: 'build.branch == "main" && build.pull_request.id == null && build.env("SBOM_GENERATE") != "false" && build.env("SBOM_UPLOAD") != "false"'
    concurrency: 1
    concurrency_group: archivematica-infrastructure/dependency-track
    timeout_in_minutes: 10
