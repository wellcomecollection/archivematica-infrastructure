[project]
name = "archivematica-observability"
version = "0.1.0"
description = "ECS discovery and cgroup evidence for Archivematica monitoring"
requires-python = ">=3.14"
dependencies = ["boto3>=1.43.106"]

[dependency-groups]
dev = [
    "opentelemetry-proto>=1.45.1",
    "prometheus-client>=0.26.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.12.21"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
